# Site settings
# This file is NOT reloaded automatically by `bundle exec jekyll serve`.
# Restart the server after editing it.

title: "Junbo Koh"
tagline: "EdTech @ SNU" # shown next to the name in the header
description: "Junbo Koh's academic homepage: learning sciences, educational technology, and human-centered AI."
url: "https://ridealist.github.io"
baseurl: ""
lang: "en"
timezone: "Asia/Seoul"
og_image: "/assets/img/profile.jpg"
google_analytics: "G-378H66FZ76"

# Top navigation. `url` is relative to the site root.
header:
  pages:
    - name: Home
      url: /
    - name: Publications
      url: /publications/
    - name: Blog
      url: /blog/
    - name: CV
      url: /cv/

# Footer columns. Icons use Font Awesome / Academicons class names.
footer:
  contact:
    - name: Email
      value: "gtkobo92@snu.ac.kr"
      url: "mailto:gtkobo92@snu.ac.kr"
      icon: "fas fa-envelope"
  follow:
    - name: Google Scholar
      url: "https://scholar.google.com/citations?user=2hDR1lgAAAAJ&hl=en"
      icon: "ai ai-google-scholar"
    - name: GitHub
      url: "https://github.com/Ridealist/"
      icon: "fab fa-github"
    - name: LinkedIn
      url: "https://www.linkedin.com/in/junbokoh92/"
      icon: "fab fa-linkedin"

# Blog post comments (utterances, keyed by page path)
utterances:
  repo: "Ridealist/Ridealist.github.io"
  issue_term: "pathname"
  theme: "github-light"

# Build settings
markdown: kramdown
highlighter: rouge
kramdown:
  input: GFM
  hard_wrap: false
  auto_ids: true
  smart_quotes: lsquo,rsquo,ldquo,rdquo
sass:
  style: compressed

permalink: /:categories/:title/

defaults:
  - scope:
      path: ""
      type: posts
    values:
      layout: post
      comments: true

plugins:
  - jekyll-feed
  - jekyll-sitemap

exclude:
  - Gemfile
  - Gemfile.lock
  - LICENSE
  - README.md
  - docs/
  - references/
  - vendor/
  - "_posts/**/*.ipynb"
  - "_posts/.jekyll-cache"
