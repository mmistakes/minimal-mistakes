---
layout: default
---
{%- assign profile = site.data.profile -%}
<div class="home">
  {%- if profile.avatar %}
  <img class="profile-pic" src="{{ profile.avatar | relative_url }}" alt="{{ profile.avatar_alt | default: site.title }}">
  {%- endif %}

  <div class="home-intro">
    {{ content }}
  </div>

  <hr class="home-divider">

  <h2>News</h2>
  {% include news.html %}
</div>
