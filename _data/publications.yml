#   tags: [aied, nlp]                                  # filter chips; slugs from _data/publication_tags.yml
#   image: "/assets/img/publications/example.png"     # optional teaser
#   note: "Honorable Mention"                          # optional
#   url: "https://example.com/paper.pdf"               # optional; makes the title a link
#   links:
#     - label: "PDF"
#       url: "https://example.com/paper.pdf"
#     - label: "ACM DL"
#       url: "https://dl.acm.org/doi/..."

