# Profile photo shown on the home page (top right).
# Put the image in assets/img/ and set the path, e.g. "/assets/img/profile.jpg".
avatar: "/assets/img/profile.jpg"
avatar_alt: "Junbo Koh"

# CV page. Embeds the Google Doc `google_doc` (the ID in docs.google.com/document/d/<ID>/edit),
# so edits to the doc show up on the site without a rebuild. The doc must be shared as
# "Anyone with the link: Viewer". Falls back to a link to `url` if `google_doc` is empty.
cv:
  google_doc: "1PGgfaXFf4T5BaNPduZi3TPmRhdUfYt5ULsStewoAdBs"
  url: "https://docs.google.com/document/d/1PGgfaXFf4T5BaNPduZi3TPmRhdUfYt5ULsStewoAdBs/edit?usp=sharing"
