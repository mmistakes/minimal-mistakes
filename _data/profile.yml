# Profile photo shown on the home page (top right).
# Put the image in assets/img/ and set the path, e.g. "/assets/img/profile.jpg".
avatar: "/assets/img/profile.jpg"
avatar_alt: "Junbo Koh"

# CV page. Embeds the PDF at `pdf`; falls back to a link to `url` if `pdf` is empty.
# To update: in Google Docs, File > Download > PDF, then replace assets/files/cv.pdf.
cv:
  pdf: "/assets/files/cv.pdf"
  url: "https://docs.google.com/document/d/1PGgfaXFf4T5BaNPduZi3TPmRhdUfYt5ULsStewoAdBs/edit?usp=sharing"
