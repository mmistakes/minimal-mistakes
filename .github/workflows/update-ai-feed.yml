name: Update AI Feed

on:
  schedule:
    - cron: "0 6 * * *" # ogni giorno alle 06:00 UTC
  workflow_dispatch: {} # per lanciarlo manualmente da GitHub Actions

permissions:
  contents: write

jobs:
  update-feed:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - run: pip install -r scripts/requirements.txt

      - run: python scripts/update_ai_feed.py

      - name: Commit e push se ci sono novità
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add _data/ai_feed.yml
          git diff --staged --quiet || git commit -m "Aggiorna AI feed"
          git diff --staged --quiet || git push
